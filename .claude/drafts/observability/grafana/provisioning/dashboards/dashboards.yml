# Провайдер дашбордов: Grafana подхватывает все *.json из каталога.
apiVersion: 1

providers:
  - name: olist
    orgId: 1
    folder: Olist
    type: file
    # Дашборд — часть репозитория; правки кликами намеренно не сохраняются.
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
