[project]
name = "olist_ml"
version = "0.1.0"
description = "MLInside demo 02-dagster: dbt + ML lifecycle в одном asset graph Dagster (Olist)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dagster==1.13.23",
    "dagster-dbt==0.29.23",
    "dagster-duckdb==0.29.23",
    # dagster-dbt 0.29.23 требует dbt-core >=1.7,<1.13
    "dbt-core>=1.11,<1.13",
    "dbt-duckdb>=1.10,<1.12",
    "duckdb>=1.5,<2",
    "mlflow>=3.15,<4",
    "scikit-learn>=1.9,<2",
    "pandas>=2.2,<3",
    "pyarrow",
    "pydantic-settings>=2.15,<3",
    # run_failure_sensor → Telegram (ADR-18) работает в проде, поэтому не в dev-группе
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "dagster-dg-cli==1.13.23",
    "dagster-webserver==1.13.23",
    "pytest>=8",
    "pytest-timeout",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/olist_ml"]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "olist_ml"
code_location_name = "olist_ml"
registry_modules = [
    "olist_ml.components.*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "smoke: определения загружаются (dg check defs, импорт definitions, dbt parse)",
    "unit: чистая логика без DuckDB, MLflow и Dagster-инстанса",
    "integration: материализация против временных DuckDB/MLflow/DAGSTER_HOME",
    "e2e: сквозной прогон на фикстурах — отдельная стадия CI",
]
addopts = "-q -m 'not e2e'"
timeout = 300

[tool.ruff]
line-length = 100
exclude = ["dbt", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["olist_ml"]
