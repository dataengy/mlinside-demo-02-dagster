# Дерево маршрутизации. ВАЖНО: provisioning перезаписывает дерево целиком,
# поэтому оно описано в одном месте и целиком.
apiVersion: 1

policies:
  - orgId: 1
    receiver: telegram
    # Группируем по имени правила и ассету: один ассет — одно сообщение,
    # а не поток одинаковых строк.
    group_by: [alertname, asset]
    # Значения маленькие намеренно: на лекции ждать 5 минут нечего.
    group_wait: 10s
    group_interval: 1m
    repeat_interval: 1h
