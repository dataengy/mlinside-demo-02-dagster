# Стенд демо 4: Dagster + MLflow (профиль core) и Grafana-стек (профиль observability).
#
#   docker compose --profile core up -d                          # демо 1-3, без Grafana
#   docker compose --profile core --profile observability up -d  # демо 4
#
# Профиль observability ВСЕГДА идёт вместе с core: dagster-exporter зависит от
# dagster-webserver, и `--profile observability` в одиночку падает с
# «depends on undefined service». Проверено `docker compose config`.
# В .env удобно держать COMPOSE_PROFILES=core, тогда `docker compose up` = core.
# Все значения — из .env; fallback `${VAR:-...}` оставлен ТОЛЬКО для не-секретов
# (порты, имена БД). Пароли и токены fallback'а не имеют — пусто = падаем сразу.
#
# Почему Postgres, а не SQLite на общей volume: см. decisions.md, ADR-2.
# В двух словах: event log пишут webserver, daemon и каждый run-процесс внутри
# контейнера daemon (DefaultRunLauncher), а SQLite на bind-mount Docker Desktop
# (virtiofs) отдаёт `database is locked`. Цена — один сервис с healthcheck.

services:
  # ---------------------------------------------------------------- core ----
  postgres:
    image: postgres:16-alpine
    profiles: ["core"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dagster}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-dagster}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      # Зависимые сервисы ждут именно готовности принимать запросы, а не старта контейнера.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dagster} -d ${POSTGRES_DB:-dagster}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  dagster-webserver:
    image: ${APP_IMAGE:-olist_ml:local}
    profiles: ["core"]
    build:
      context: .
      dockerfile: Dockerfile
    # --log-format json: у Dagster НЕТ переменной DAGSTER_LOG_FORMAT, формат
    # задаётся только флагом CLI (colored|json|rich). JSON нужен, чтобы Loki
    # разбирал логи меткой уровня, а не регуляркой.
    command: >
      dagster-webserver --log-format json
      -h 0.0.0.0 -p ${DAGSTER_PORT:-3111}
      -w ${DAGSTER_WORKSPACE:-/opt/dagster/app/workspace.yaml}
    environment:
      DAGSTER_HOME: /opt/dagster/dagster_home
      DAGSTER_PG_HOST: postgres
      DAGSTER_PG_PORT: ${POSTGRES_PORT:-5432}
      DAGSTER_PG_USER: ${POSTGRES_USER:-dagster}
      DAGSTER_PG_PASSWORD: ${POSTGRES_PASSWORD}
      DAGSTER_PG_DB: ${POSTGRES_DB:-dagster}
      DUCKDB_PATH: /opt/dagster/data/olist.duckdb
      MLFLOW_TRACKING_URI: http://mlflow:${MLFLOW_PORT:-5001}
    volumes:
      - ./dagster.prod.yaml:/opt/dagster/dagster_home/dagster.yaml:ro
      - data:/opt/dagster/data
    ports:
      - "${DAGSTER_PORT:-3111}:${DAGSTER_PORT:-3111}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # В образе гарантированно есть python — не завязываемся на curl/wget.
      test: ["CMD-SHELL", "python -c \"import urllib.request,os,sys; urllib.request.urlopen('http://localhost:'+os.environ.get('DAGSTER_PORT','3111')+'/server_info')\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  dagster-daemon:
    image: ${APP_IMAGE:-olist_ml:local}
    profiles: ["core"]
    # Тот же образ, что и webserver: разные процессы одного приложения.
    command: >
      dagster-daemon run --log-format json
      -w ${DAGSTER_WORKSPACE:-/opt/dagster/app/workspace.yaml}
    environment:
      DAGSTER_HOME: /opt/dagster/dagster_home
      DAGSTER_PG_HOST: postgres
      DAGSTER_PG_PORT: ${POSTGRES_PORT:-5432}
      DAGSTER_PG_USER: ${POSTGRES_USER:-dagster}
      DAGSTER_PG_PASSWORD: ${POSTGRES_PASSWORD}
      DAGSTER_PG_DB: ${POSTGRES_DB:-dagster}
      DUCKDB_PATH: /opt/dagster/data/olist.duckdb
      MLFLOW_TRACKING_URI: http://mlflow:${MLFLOW_PORT:-5001}
      # «Уровень 0» из ТЗ: run_failure_sensor шлёт в Telegram сам, без Grafana.
      ALERTS_ENABLED: ${ALERTS_ENABLED:-false}
      TG_BOT_TOKEN: ${TG_BOT_TOKEN:-}
      TG_CHAT_ID: ${TG_CHAT_ID:-}
    volumes:
      - ./dagster.prod.yaml:/opt/dagster/dagster_home/dagster.yaml:ro
      - data:/opt/dagster/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  mlflow:
    image: ${MLFLOW_IMAGE:-ghcr.io/mlflow/mlflow:v3.16.1}
    profiles: ["core"]
    # MLFLOW_SERVER_ALLOWED_HOSTS обязателен: в 3.x включена защита от DNS
    # rebinding, и по умолчанию разрешены только localhost и приватные IP.
    # Запрос с Host: mlflow:5001 (из контейнеров Dagster/экспортера) иначе -> 403.
    environment:
      MLFLOW_SERVER_ALLOWED_HOSTS: ${MLFLOW_ALLOWED_HOSTS:-mlflow,mlflow:5001,localhost,localhost:5001,127.0.0.1,127.0.0.1:5001}
    command: >
      mlflow server
      --backend-store-uri sqlite:////data/mlflow.db
      --artifacts-destination /data/mlruns
      --host 0.0.0.0 --port ${MLFLOW_PORT:-5001}
    volumes:
      - data:/data
    ports:
      - "${MLFLOW_PORT:-5001}:${MLFLOW_PORT:-5001}"
    restart: unless-stopped

  # ------------------------------------------------------- observability ----
  dagster-exporter:
    build:
      context: ./exporter
    image: ${EXPORTER_IMAGE:-olist_ml_exporter:local}
    profiles: ["observability"]
    environment:
      DAGSTER_GRAPHQL_URL: http://dagster-webserver:${DAGSTER_PORT:-3111}/graphql
      MLFLOW_TRACKING_URI: http://mlflow:${MLFLOW_PORT:-5001}
      MLFLOW_EXPERIMENT: ${MLFLOW_EXPERIMENT:-olist_ml}
      MLFLOW_METRICS: ${MLFLOW_METRICS:-roc_auc}
      POLL_SECONDS: ${EXPORTER_POLL_SECONDS:-15}
      EXPORTER_PORT: ${EXPORTER_PORT:-9101}
    depends_on:
      dagster-webserver:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.7.3
    profiles: ["observability"]
    # Короткий retention: это демо-стенд, а не хранилище истории.
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=${PROM_RETENTION:-24h}
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    restart: unless-stopped

  loki:
    image: grafana/loki:3.5.9
    profiles: ["observability"]
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki:/loki
    ports:
      - "${LOKI_PORT:-3100}:3100"
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.12.1
    profiles: ["observability"]
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      # ro-сокет нужен discovery.docker: Alloy только читает список контейнеров
      # и их лог-стримы. Это всё равно доступ уровня root к демону Docker —
      # на проде так не делают, для локального демо приемлемо (см. docs).
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy:/var/lib/alloy/data
    ports:
      - "${ALLOY_PORT:-12345}:12345"
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.3.1
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      # Пробрасываются в provisioning-файлы через ${VAR} (Grafana раскрывает
      # переменные окружения во ВСЕХ provisioning-конфигах).
      TG_BOT_TOKEN: ${TG_BOT_TOKEN:-}
      TG_CHAT_ID: ${TG_CHAT_ID:-}
      PROMETHEUS_URL: http://prometheus:9090
      LOKI_URL: http://loki:3100
      MODEL_METRIC_THRESHOLD: ${MODEL_METRIC_THRESHOLD:-0.7}
      FRESHNESS_MAX_AGE_SECONDS: ${FRESHNESS_MAX_AGE_SECONDS:-900}
    volumes:
      # Provisioning смонтирован read-only: источник правды — репозиторий,
      # правки кликами в UI не переживают перезапуск и это намеренно.
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

volumes:
  data:        # DuckDB + mlruns + mlflow.db, общий для Dagster и MLflow
  postgres:
  prometheus:
  loki:
  alloy:
  grafana:
