[project]
name = "olist_ml"
version = "0.1.0"
description = "MLInside demo 02-dagster: оркестрация ML-пайплайна Olist на Dagster (dlt → dbt → ML → CI/CD)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dagster==1.13.23",
    "dagster-dbt==0.29.23",
    "dagster-dlt==0.29.23",
    "dagster-duckdb==0.29.23",
    "dagster-postgres==0.29.23",
    # dagster-dbt 0.29.23 требует dbt-core>=1.7,<1.13 — 1.12.5 в это окно попадает.
    "dbt-core==1.12.5",
    "dbt-duckdb==1.11.0",
    "duckdb==1.5.5",
    "dlt[duckdb]==1.30.0",
    "mlflow==3.16.1",
    "kagglehub==1.0.2",
    "scikit-learn==1.9.1",
    "pandas",
    "pyarrow",
    "pydantic-settings==2.15.0",
]

[dependency-groups]
dev = [
    "dagster-dg-cli==1.13.23",
    "dagster-webserver==1.13.23",
    "pytest>=8",
    "pytest-timeout",
    "ruff",
    # httpx нужен тестам GraphQL webserver'а (e2e) — см. TODO про run_failure_sensor
    # в REPORT.md: если сенсор из Демо 4 тоже дёргает httpx.post в проде, его
    # придётся поднять в основные dependencies.
    "httpx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/olist_ml"]

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "olist_ml"
code_location_name = "olist_ml"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "smoke: определения загружаются (dg check defs / list defs, dbt parse) — самые быстрые тесты",
    "unit: чистая логика без DuckDB, MLflow и Dagster-инстанса",
    "integration: материализация против временных DuckDB/MLflow/DAGSTER_HOME",
    "e2e: поднимает dg dev в подпроцессе и ходит по GraphQL — только по явному запросу",
]
addopts = "-q -m 'not e2e'"

[tool.ruff]
line-length = 100
exclude = ["dbt"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["olist_ml"]
