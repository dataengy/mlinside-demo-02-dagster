# Prometheus демо-стенда: одна цель — sidecar-экспортер.
# Alloy сюда ничего не пишет, поэтому remote-write receiver не включаем
# (--web.enable-remote-write-receiver в compose отсутствует намеренно).

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Метрики Dagster (runs, asset checks, freshness) и MLflow (метрика модели).
  - job_name: dagster-exporter
    static_configs:
      - targets: ["dagster-exporter:9101"]

  # Самоконтроль: если экспортер молчит, up{job="dagster-exporter"} == 0
  # и это видно на дашборде раньше, чем «алерты просто не приходят».
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
