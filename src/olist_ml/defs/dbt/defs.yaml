# dbt-модели как ассеты, dbt-тесты как asset checks (ADR-04). В граф входит только ветка витрины
# признаков: `+mart_order_features` = 8 staging + 3 intermediate + 1 mart (+ справочные seeds);
# остальные marts канона остаются в копии, но не в графе. Snapshot raw/* — отдельный компонент
# defs/ingest (исключён здесь через path:seeds/raw); source-узлы склеиваются с ним по
# meta.dagster.asset_key (ADR-05).
type: dagster_dbt.DbtProjectComponent
# Template-функции (asset freshness витрины — ADR-17).
template_vars_module: .template_vars

attributes:
  project:
    project_dir: "{{ project_root }}/dbt"
  select: "+mart_order_features"
  exclude: "path:seeds/raw"
  # Indirect selection = cautious задаётся через env DBT_INDIRECT_SELECTION (defs/env.py, Justfile):
  # флаг в cli_args перебил бы `empty`, который dagster-dbt выставляет для run без checks.
  cli_args: [build]
  op:
    name: dbt_feature_branch
  translation:
    key: "{{ node.name }}"
    # Группа = слой из пути модели (staging / intermediate / marts); справочные seeds — в `seeds`.
    group_name: "{{ node.fqn[1] if node.fqn | length > 2 else 'seeds' }}"
    description: "{{ node.description or ('dbt-модель ' ~ node.name) }}"
    owners: ["team:data-engineering"]
    # Asset freshness только у витрины признаков (когда материализована — не свежесть данных внутри).
    freshness_policy: "{{ mart_freshness if node.name == 'mart_order_features' else none }}"
    tags:
      layer: "{{ node.fqn[1] if node.fqn | length > 2 else 'seeds' }}"
      dbt_resource_type: "{{ node.resource_type }}"
  # manifest собирает `just dbt-parse` (ADR-04b).
  prepare_if_dev: false
